<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`
             SELECT ?item ?itemLabel
              WHERE
              {
                ?item wdt:P27 wd:${riik.value}. 
                ?item wdt:P106 wd:${amet.value}.
              
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
                } 
              }
              LIMIT 10
           `;
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);      
           fetch(aadress).then(d => d.json()).then(kuva);
        }

        function kysi2(){
           let lause=`
             SELECT ?item ?itemLabel
              WHERE
              {
                ?item wdt:P27 wd:${riik.value}. 
                ?item wdt:P106 wd:${amet.value}.
              
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
                } 
              }
              LIMIT 10
           `;
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);      
           fetch(aadress).then(d => d.json()).then(kuva);
        }


       
        function kuva(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>
  </head>
  <body>
    <select id="riik" onchange="kysi1()">
      <option value="Q33">Soome</option>
      <option value="Q191">Eesti</option>
      <option value="Q884">Lõuna-Korea</option>
      <option value="Q17">Jaapan</option>
      <option value="Q34">Rootsi</option>
      <option value="Q408">Austraalia</option>
      </select>
    <select id="amet” onchange="kysi2()">
      <option value="Q177220">Laulja</option>
      <option value="Q15253558">Aktivist</option>
      <option value="Q2526255">Režišöör</option>
      <option value="Q36180">Kirjanik</option>
      <option value="Q10800557">Filmi näitleja</option>
      <option value="Q2405480">Häälnäitleja</option>
      </select>

     <input type="button" value="otsi" onclick="kysi1()" />
     <input type="button" value="otsi" onclick="kysi2()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
