<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           //Jaapani autorite teosed
           let lause=`SELECT ?autor ?autorLabel (COUNT(*) as ?kogus) {
                ?isik wdt:P495 wd:${riik.value}.
                ?isik wdt:P7937 wd:${formaat.value}.
                ?isik wdt:P50 ?autor.
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "et,en".
                } 
              
              } GROUP BY ?autor ?autorLabel
               ORDER BY DESC(?kogus)

              LIMIT 10
           `;
           console.log(lause);
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);  
           vastus.innerHTML="ootan vastust";
           fetch(aadress).then(d => d.json()).then(kuva);
        }


       
        function kuva(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["autorLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["autorLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>
  </head>
  <body>
    <select id="riik" onchange="kysi()">
      <option value="Q33">Soome</option>
      <option value="Q191">Eesti</option>
      <option value="Q884">Lõuna-Korea</option>
      <option value="Q17">Jaapan</option>
      <option value="Q34">Rootsi</option>
      <option value="Q408">Austraalia</option>
      </select>

    <select id="formaat" onchange="kysi()">
      <option value="Q49084">novell</option>
      <option value="Q35760">essee</option>
      <option value="Q8261">romaan</option>
      <option value="Q25379">näidend</option>
      <option value="Q5185279">luuletus</option>
      <option value="Q37707">haiku</option>
      <option value="Q185598">päevik</option>
      </select>

     <input type="button" value="otsi" onclick="kysi()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
